<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" style="max-width:100%;height:auto" role="img" aria-label="One incident for order-service goes into Versus, which renders it with your templates and sends each channel its own format; Slack shows Critical Error in order-service, the ERROR log line in a code block, and Owner at alex please investigate; Telegram shows a chat bubble reading Critical Error Detected, Service: order-service; Email shows the subject Critical Error Alert and a body reading Critical Error Detected in order-service, Please investigate this issue immediately; Microsoft Teams, Viber and Lark take their own templates too">
  <title>One incident, each channel in its own format</title>
  <desc>Versus renders the order-service incident through a separate template per channel: a Slack message with a code block and a mention, a Telegram bubble, and an email with a subject line, plus Microsoft Teams, Viber and Lark</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; fill: #000000; }
      .m { text-anchor: middle; }
      .name { font-weight: 700; fill: #12222F; }
      .zone { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #5B6B78; }
      .d { font-size: 13px; fill: #5B6B78; }
      .c { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #12222F; }
      .b { font-weight: 700; }
      .blk { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
      .more { fill: #F2F5F8; stroke: #C3CED8; stroke-width: 1.5; }
      .line { fill: none; stroke: #000000; stroke-width: 2.5; }
      .flow { fill: none; stroke: #000000; stroke-width: 2.5; marker-end: url(#a); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="760" height="504" fill="#FFFFFF"/>

  <!-- blocks: incident and Versus -->
  <rect class="blk" x="16" y="178" width="156" height="72" rx="12"/>
  <rect class="blk" x="210" y="174" width="120" height="80" rx="14"/>

  <!-- blocks: Slack -->
  <rect class="blk" x="402" y="20" width="342" height="120" rx="12"/>
  <rect x="422" y="80" width="260" height="24" rx="4" fill="#F7F9FB" stroke="#D8E0E8" stroke-width="1"/>
  <rect x="466" y="115" width="46" height="18" rx="3" fill="#BACFE3"/>

  <!-- blocks: Telegram -->
  <rect x="402" y="154" width="342" height="120" rx="12" fill="#F2F5F8" stroke="#000000" stroke-width="2"/>
  <rect x="418" y="188" width="306" height="74" rx="12" fill="#FFFFFF" stroke="#C3CED8" stroke-width="1.5"/>

  <!-- blocks: Email -->
  <rect class="blk" x="402" y="288" width="342" height="120" rx="12"/>
  <path d="M422 348 H724" fill="none" stroke="#C3CED8" stroke-width="1.5"/>

  <!-- blocks: more channels -->
  <rect class="more" x="402" y="450" width="144" height="34" rx="10"/>
  <rect class="more" x="558" y="450" width="76" height="34" rx="10"/>
  <rect class="more" x="646" y="450" width="68" height="34" rx="10"/>

  <!-- arrows -->
  <path class="flow" d="M172 214 H205"/>
  <path class="line" d="M330 214 H356 M356 80 V348"/>
  <path class="flow" d="M356 80 H397"/>
  <path class="flow" d="M356 214 H397"/>
  <path class="flow" d="M356 348 H397"/>
  <path class="flow dash" d="M356 348 V467 H397"/>

  <!-- text: incident and Versus -->
  <text class="zone m" x="94" y="202">ONE INCIDENT</text>
  <text class="name m" x="94" y="230" font-size="17">order-service</text>

  <text class="name m" x="270" y="208" font-size="22">Versus</text>
  <text class="d m" x="270" y="232">your templates</text>

  <!-- text: Slack -->
  <text class="zone" x="422" y="44">SLACK</text>
  <text class="name" x="422" y="68" font-size="15">Critical Error in order-service</text>
  <text class="c" x="432" y="96">[ERROR] This is an error log</text>
  <text x="422" y="128" font-size="13">Owner</text>
  <text class="name" x="470" y="128" font-size="13">@alex</text>
  <text x="518" y="128" font-size="13">please investigate</text>

  <!-- text: Telegram -->
  <text class="zone" x="422" y="176">TELEGRAM</text>
  <text class="name" x="434" y="217" font-size="15">Critical Error Detected!</text>
  <text xml:space="preserve" style="white-space:pre" x="434" y="244" font-size="13"><tspan class="b">Service: </tspan>order-service</text>

  <!-- text: Email -->
  <text class="zone" x="422" y="312">EMAIL</text>
  <text class="d" x="422" y="336">Subject:</text>
  <text class="name" x="482" y="336" font-size="15">Critical Error Alert</text>
  <text x="422" y="372" font-size="13">Critical Error Detected in order-service</text>
  <text x="422" y="394" font-size="13">Please investigate this issue immediately</text>

  <!-- text: more channels -->
  <text class="zone" x="402" y="438">AND MORE</text>
  <text class="name m" x="474" y="472" font-size="14">Microsoft Teams</text>
  <text class="name m" x="596" y="472" font-size="14">Viber</text>
  <text class="name m" x="680" y="472" font-size="14">Lark</text>
</svg>
