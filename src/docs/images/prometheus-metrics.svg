<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" style="max-width:100%;height:auto" role="img" aria-label="Prometheus, or a compatible API such as Mimir, Cortex, Thanos, Grafana Cloud or VictoriaMetrics, feeds Versus Enterprise; Versus connects read only with no queries, picks what to watch, learns each signal's normal by time of week, and detects a signal that stays far outside normal, and it keeps learning as traffic changes; in detect mode it opens an incident such as Anomaly: checkout, error_rate above baseline, and sends it to Slack, Telegram or PagerDuty">
  <title>Versus finds what to watch in Prometheus</title>
  <desc>Prometheus feeds Versus Enterprise, which connects, picks what to watch, learns normal by time of week and detects a signal that stays far outside normal, then opens an incident sent to Slack, Telegram or PagerDuty</desc>
  <defs>
    <style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#000000}
      .c{font-family:SFMono-Regular,Menlo,Consolas,monospace;fill:#12222F}
      .f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f14{font-size:14px}.f17{font-size:17px}
      .b{font-weight:700}.nm{fill:#12222F}.sec{fill:#5B6B78}
      .zone{font-size:11px;font-weight:700;fill:#5B6B78;letter-spacing:1.5px}
      .pt{font-size:18px;font-weight:700;fill:#12222F}
      .mid{text-anchor:middle}
      .flow{fill:none;stroke:#000000;stroke-width:2.5}
      .loop{fill:none;stroke:#000000;stroke-width:2;stroke-dasharray:6 4}
      .blk{fill:#FFFFFF;stroke:#000000;stroke-width:2}
      .sub{fill:#BACFE3;stroke:#000000;stroke-width:2}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="760" height="528" fill="#FFFFFF"/>

  <text x="24" y="40" class="pt">Versus finds what to watch in Prometheus</text>
  <text x="24" y="64" class="f13 sec">It learns each signal's normal by time of week and alerts only when one stays wrong</text>

  <!-- Versus panel -->
  <rect x="200" y="84" width="320" height="370" rx="12" fill="#FFFFFF" stroke="#9AA9B6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="216" y="108" class="zone">VERSUS</text>
  <rect x="276" y="95" width="72" height="18" rx="9" fill="#FFFFFF" stroke="#5B6B78"/>
  <text x="312" y="108" class="f11 b sec mid">Enterprise</text>

  <!-- source -->
  <rect class="blk" x="20" y="101" width="160" height="94" rx="12"/>
  <text x="100" y="128" class="f17 b nm mid">Prometheus</text>
  <text x="100" y="150" class="f12 sec mid">or Mimir, Cortex,</text>
  <text x="100" y="166" class="f12 sec mid">Thanos, Grafana Cloud,</text>
  <text x="100" y="182" class="f12 sec mid">VictoriaMetrics</text>

  <!-- steps -->
  <rect class="blk" x="318" y="120" width="190" height="56" rx="12"/>
  <text x="413" y="144" class="f17 b nm mid">Connect</text>
  <text x="413" y="164" class="f12 sec mid">read only, no queries</text>

  <rect class="blk" x="318" y="206" width="190" height="56" rx="12"/>
  <text x="413" y="230" class="f17 b nm mid">Discover</text>
  <text x="413" y="250" class="f12 sec mid">picks what to watch</text>

  <rect class="sub" x="318" y="292" width="190" height="56" rx="12"/>
  <text x="413" y="316" class="f17 b nm mid">Learn normal</text>
  <text x="413" y="336" class="f12 nm mid">by time of week</text>

  <rect class="sub" x="318" y="378" width="190" height="56" rx="12"/>
  <text x="413" y="402" class="f17 b nm mid">Detect</text>
  <text x="413" y="422" class="f12 nm mid">stays far outside normal</text>

  <text x="236" y="346" class="f12 sec">keeps</text>
  <text x="236" y="362" class="f12 sec">learning as</text>
  <text x="236" y="378" class="f12 sec">traffic</text>
  <text x="236" y="394" class="f12 sec">changes</text>

  <!-- incident -->
  <text x="546" y="352" class="zone">IN DETECT MODE</text>
  <rect x="546" y="364" width="194" height="84" rx="12" fill="#FFFFFF" stroke="#12222F" stroke-width="2"/>
  <text x="562" y="392" class="f14 b nm">Anomaly: checkout</text>
  <text x="562" y="412" class="c f11">error_rate</text>
  <text x="562" y="430" class="f12 sec">above baseline</text>

  <rect class="blk" x="546" y="476" width="48" height="32" rx="10"/>
  <rect class="blk" x="598" y="476" width="66" height="32" rx="10"/>
  <rect class="blk" x="668" y="476" width="72" height="32" rx="10"/>
  <text x="570" y="496" class="f12 nm mid">Slack</text>
  <text x="631" y="496" class="f12 nm mid">Telegram</text>
  <text x="704" y="496" class="f12 nm mid">PagerDuty</text>

  <!-- flows -->
  <path class="flow" d="M186 148H311" marker-end="url(#a)"/>
  <path class="flow" d="M413 182V199" marker-end="url(#a)"/>
  <path class="flow" d="M413 268V285" marker-end="url(#a)"/>
  <path class="flow" d="M413 354V371" marker-end="url(#a)"/>
  <path class="loop" d="M312 406H226V320H311" marker-end="url(#a)"/>
  <path class="flow" d="M514 406H539" marker-end="url(#a)"/>
  <path class="flow" d="M643 454V469" marker-end="url(#a)"/>
</svg>
