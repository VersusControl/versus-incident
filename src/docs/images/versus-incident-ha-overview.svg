<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-label="A load balancer routes requests across three Versus Enterprise replicas, each replica owns a separate source and job share, and every replica reads and writes shared Postgres for incidents, sessions, and managed secrets">
  <title>Versus Enterprise high availability</title>
  <desc>Requests reach every replica while source and job ownership stays separate and shared Postgres keeps durable state consistent</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; fill: #000000; }
      .name { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; fill: #12222F; }
      .zone { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #5B6B78; }
      .detail { font-size: 12px; fill: #5B6B78; }
      .connector { fill: none; stroke: #000000; stroke-width: 2.5; }
      .flow { fill: none; stroke: #000000; stroke-width: 2.5; marker-end: url(#a); }
      .sync { fill: none; stroke: #000000; stroke-width: 2.5; marker-start: url(#a); marker-end: url(#a); }
    </style>
  </defs>

  <rect width="760" height="510" fill="#FFFFFF"/>
  <rect x="28" y="145" width="704" height="180" rx="14" fill="#F2F5F8"/>

  <rect x="250" y="30" width="260" height="76" rx="13" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text class="name" x="380" y="63" font-size="20" text-anchor="middle">Load balancer</text>
  <text class="t detail" x="380" y="84" text-anchor="middle">request routing</text>

  <rect x="52" y="195" width="190" height="92" rx="13" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text class="name" x="147" y="225" font-size="19" text-anchor="middle">versus-0</text>
  <text class="t detail" x="147" y="247" text-anchor="middle">index 0 of 3</text>
  <text class="t detail" x="147" y="267" text-anchor="middle">source and job share</text>

  <rect x="285" y="195" width="190" height="92" rx="13" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text class="name" x="380" y="225" font-size="19" text-anchor="middle">versus-1</text>
  <text class="t detail" x="380" y="247" text-anchor="middle">index 1 of 3</text>
  <text class="t detail" x="380" y="267" text-anchor="middle">source and job share</text>

  <rect x="518" y="195" width="190" height="92" rx="13" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text class="name" x="613" y="225" font-size="19" text-anchor="middle">versus-2</text>
  <text class="t detail" x="613" y="247" text-anchor="middle">index 2 of 3</text>
  <text class="t detail" x="613" y="267" text-anchor="middle">source and job share</text>

  <rect x="245" y="405" width="270" height="78" rx="13" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text class="name" x="380" y="439" font-size="20" text-anchor="middle">Shared Postgres</text>
  <text class="t detail" x="380" y="461" text-anchor="middle">incidents, sessions, secrets</text>

  <text class="zone" x="54" y="171">ENTERPRISE REPLICA SET</text>

  <path class="connector" d="M380 111 V128 M147 128 H613"/>
  <path class="flow" d="M147 128 V190"/>
  <path class="flow" d="M380 128 V190"/>
  <path class="flow" d="M613 128 V190"/>

  <path class="sync" d="M147 292 V350 H315 V400"/>
  <path class="sync" d="M380 292 V400"/>
  <path class="sync" d="M613 292 V350 H445 V400"/>
  <rect x="290" y="365" width="180" height="22" rx="4" fill="#FFFFFF"/>
  <text class="t" x="380" y="380" font-size="12" text-anchor="middle">shared reads and writes</text>
</svg>