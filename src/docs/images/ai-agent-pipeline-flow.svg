<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" role="img" aria-label="How one log line is processed. Read it from the logs data source, hide sensitive bits, then decide whether the line is worth learning from: if no it is ignored, if yes it is grouped with similar lines and the group is remembered in the catalog. Then, depending on the agent mode: training just learns it, shadow pretends to alert and logs only, detect sends a real incident for unfamiliar lines. The catalog keeps learning as traffic changes.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .name { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#12222F; }
      .t    { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; fill:#5B6B78; }
      .lab  { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; fill:#000000; }
    </style>
  </defs>

  <rect width="760" height="428" fill="#FFFFFF"/>

  <rect x="24" y="36" width="164" height="64" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="106" y="64" text-anchor="middle" class="name" font-size="13">Read the logs</text>
  <text x="106" y="84" text-anchor="middle" class="t" font-size="11.5">app logs, files, streams</text>

  <path d="M192,68 H224" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="228" y="36" width="164" height="64" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="64" text-anchor="middle" class="name" font-size="13">Hide sensitive bits</text>
  <text x="310" y="84" text-anchor="middle" class="t" font-size="11.5">tokens, keys, emails</text>

  <path d="M396,68 H428" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <polygon points="492,32 552,68 492,104 432,68" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="492" y="64" text-anchor="middle" class="name" font-size="11.5">Worth</text>
  <text x="492" y="78" text-anchor="middle" class="name" font-size="11.5">learning?</text>

  <text x="582" y="58" text-anchor="middle" class="lab" font-size="12">no</text>
  <path d="M556,68 H608" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="612" y="40" width="124" height="56" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="674" y="73" text-anchor="middle" class="name" font-size="13">Ignore</text>

  <text x="504" y="126" text-anchor="start" class="lab" font-size="12">yes</text>
  <path d="M492,108 V132 H106 V152" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="24" y="156" width="164" height="64" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="106" y="184" text-anchor="middle" class="name" font-size="13">Group similar lines</text>
  <text x="106" y="204" text-anchor="middle" class="t" font-size="11.5">one entry per shape</text>

  <path d="M192,188 H224" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="228" y="156" width="164" height="64" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="310" y="184" text-anchor="middle" class="name" font-size="13">Remember the group</text>
  <text x="310" y="204" text-anchor="middle" class="t" font-size="11.5">save to the catalog</text>

  <path d="M396,188 H426" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <polygon points="492,150 554,188 492,226 430,188" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="492" y="184" text-anchor="middle" class="name" font-size="11.5">What do we</text>
  <text x="492" y="198" text-anchor="middle" class="name" font-size="11.5">do with it?</text>

  <path d="M492,230 V252" stroke="#000000" stroke-width="2.5" fill="none"/>
  <path d="M129,252 H630" stroke="#000000" stroke-width="2.5" fill="none"/>
  <path d="M129,252 V282" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M379,252 V282" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M630,252 V282" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <text x="139" y="272" text-anchor="start" class="lab" font-size="12">training</text>
  <text x="389" y="272" text-anchor="start" class="lab" font-size="12">shadow</text>
  <text x="640" y="272" text-anchor="start" class="lab" font-size="12">detect</text>

  <rect x="24" y="286" width="210" height="60" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="129" y="312" text-anchor="middle" class="name" font-size="13">Just learn it</text>
  <text x="129" y="332" text-anchor="middle" class="t" font-size="11.5">no alerts at all</text>

  <rect x="274" y="286" width="210" height="60" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="379" y="312" text-anchor="middle" class="name" font-size="13">Pretend to alert</text>
  <text x="379" y="332" text-anchor="middle" class="t" font-size="11.5">log only, useful to review</text>

  <rect x="524" y="286" width="212" height="60" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="630" y="312" text-anchor="middle" class="name" font-size="13">Send a real incident</text>
  <text x="630" y="332" text-anchor="middle" class="t" font-size="11.5">only for unfamiliar lines</text>

  <path d="M630,350 V386 H12 V188 H20" stroke="#000000" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <text x="360" y="406" text-anchor="middle" class="t" font-size="12">keeps learning as traffic changes</text>
</svg>
