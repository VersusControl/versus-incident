<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" style="max-width:100%;height:auto" role="img" aria-label="Memory of one Pod over the last 6 hours, as 5 minute medians that climb from about 150 to 330 MiB with garbage collection dips; a robust Theil-Sen trend line runs through them and a Mann-Kendall test confirms the trend; the line is projected forward and crosses the 512 MiB container limit about 6 hours from now, reported as a warning">
  <title>Memory trend projected to the container limit</title>
  <desc>Noisy memory samples climbing over 6 hours, a robust trend line projected forward until it crosses the container limit in about 6 hours, with a note that the trend is confirmed by a Mann-Kendall test</desc>
  <defs>
    <style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#000000}
      .f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f15{font-size:15px}
      .b{font-weight:700}.nm{fill:#12222F}.sec{fill:#5B6B78}
      .pt{font-size:18px;font-weight:700;fill:#12222F}
      .mid{text-anchor:middle}.end{text-anchor:end}
      .grid{fill:none;stroke:#C3CED8;stroke-width:1}
      .acc{fill:#E8590C}
      .accT{fill:#FDE7D8;stroke:#E8590C}
      .accS{fill:none;stroke:#E8590C}
    </style>
  </defs>

  <rect width="760" height="366" fill="#FFFFFF"/>

  <text x="24" y="34" class="pt">Memory trend: a leak, found hours before the limit</text>
  <text x="24" y="56" class="f13 sec">A robust slope over the last 6 hours, projected forward to the container limit</text>

  <!-- legend -->
  <circle cx="74" cy="84" r="3" fill="#000000"/>
  <text x="84" y="88" class="f12">memory per Pod, 5 minute medians</text>
  <path d="M318 84H342" fill="none" stroke="#000000" stroke-width="3"/>
  <text x="350" y="88" class="f12">robust trend</text>
  <path d="M452 84H476" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="484" y="88" class="f12">projection</text>

  <!-- grid -->
  <path class="grid" d="M70 285H370M70 240H370M70 195H370"/>
  <text x="62" y="289" class="f11 sec end">200Mi</text>
  <text x="62" y="244" class="f11 sec end">300Mi</text>
  <text x="62" y="199" class="f11 sec end">400Mi</text>

  <!-- limit -->
  <path d="M70 144.6H730" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="70" y="136" class="f12 b nm">container memory limit 512Mi</text>

  <!-- samples -->
  <polyline fill="none" stroke="#9AA9B6" stroke-width="1.5" stroke-linejoin="round" points="70,311.1 82.5,303.2 95,295.4 107.5,303.7 120,295.8 132.5,287 145,280.1 157.5,288.4 170,284.1 182.5,276.2 195,268.4 207.5,276.7 220,268.8 232.5,260 245,253.1 257.5,261.4 270,257.1 282.5,249.2 295,241.4 307.5,249.7 320,241.8 332.5,233 345,226.1 357.5,234.4 370,230.1"/>
  <g fill="#000000">
    <circle cx="70" cy="311.1" r="2.5"/><circle cx="82.5" cy="303.2" r="2.5"/><circle cx="95" cy="295.4" r="2.5"/><circle cx="107.5" cy="303.7" r="2.5"/><circle cx="120" cy="295.8" r="2.5"/>
    <circle cx="132.5" cy="287" r="2.5"/><circle cx="145" cy="280.1" r="2.5"/><circle cx="157.5" cy="288.4" r="2.5"/><circle cx="170" cy="284.1" r="2.5"/><circle cx="182.5" cy="276.2" r="2.5"/>
    <circle cx="195" cy="268.4" r="2.5"/><circle cx="207.5" cy="276.7" r="2.5"/><circle cx="220" cy="268.8" r="2.5"/><circle cx="232.5" cy="260" r="2.5"/><circle cx="245" cy="253.1" r="2.5"/>
    <circle cx="257.5" cy="261.4" r="2.5"/><circle cx="270" cy="257.1" r="2.5"/><circle cx="282.5" cy="249.2" r="2.5"/><circle cx="295" cy="241.4" r="2.5"/><circle cx="307.5" cy="249.7" r="2.5"/>
    <circle cx="320" cy="241.8" r="2.5"/><circle cx="332.5" cy="233" r="2.5"/><circle cx="345" cy="226.1" r="2.5"/><circle cx="357.5" cy="234.4" r="2.5"/><circle cx="370" cy="230.1" r="2.5"/>
  </g>

  <!-- trend and projection -->
  <path d="M70 307.5L370 226.5" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M370 226.5L673.3 144.6" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="673.3" cy="144.6" r="7" class="acc" stroke="#000000" stroke-width="2"/>

  <!-- trend note -->
  <text x="80" y="168" class="f13 b nm">Trend confirmed (Mann-Kendall)</text>
  <text x="80" y="186" class="f12 sec">Theil-Sen slope over 6 h, ignores garbage collection dips</text>

  <!-- callout -->
  <path d="M673.3 206V156" class="accS" stroke-width="1.5"/>
  <rect x="530" y="210" width="200" height="56" rx="12" class="accT" stroke-width="2"/>
  <text x="630" y="233" class="f15 b nm mid">limit reached in ~6 h</text>
  <text x="630" y="252" class="f12 nm mid">reported as a warning</text>

  <!-- axis -->
  <path d="M70 330H730M70 330V336M170 330V336M270 330V336M370 330V336M470 330V336M570 330V336M670 330V336" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="70" y="350" class="f12 sec mid">6 h ago</text>
  <text x="170" y="350" class="f12 sec mid">4 h ago</text>
  <text x="270" y="350" class="f12 sec mid">2 h ago</text>
  <text x="370" y="350" class="f12 b nm mid">now</text>
  <text x="470" y="350" class="f12 sec mid">+2 h</text>
  <text x="570" y="350" class="f12 sec mid">+4 h</text>
  <text x="670" y="350" class="f12 sec mid">+6 h</text>
</svg>
