{{- include "versus-incident.validateRedis" . -}}
{{- include "versus-incident.validateStorage" . -}}
{{- include "versus-incident.validateAgent" . -}}
{{- include "versus-incident.validateHA" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "versus-incident.fullname" . }}-config
  labels:
    {{- include "versus-incident.labels" . | nindent 4 }}
data:
  config.yaml: |
    name: {{ .Values.config.name }}
    host: {{ .Values.config.host }}
    port: {{ .Values.config.port }}
    {{- if .Values.config.publicHost }}
    public_host: {{ .Values.config.publicHost }}
    {{- end }}

    # Shared secret gating /api/admin/* and /api/agent/*. Empty value
    # leaves admin routes unregistered (no silent open surface).
    gateway_secret: ${GATEWAY_SECRET}

    # Outbound HTTP proxy used by the channels that opt in via `use_proxy`
    # (telegram, viber, lark). Values arrive from the chart Secret as env
    # vars; an unset PROXY_URL expands to empty, which disables the proxy.
    proxy:
      url: ${PROXY_URL}
      username: ${PROXY_USERNAME}
      password: ${PROXY_PASSWORD}

    # Pluggable storage backend. `file` (single-node) or `postgres` (durable,
    # multi-writer). HA (ha.enabled) derives `postgres` automatically — all
    # replicas share ONE Postgres. POSTGRES_DSN is injected from a Secret.
    storage:
      type: {{ include "versus-incident.storageType" . }}
      {{- if eq (include "versus-incident.storageType" .) "file" }}
      file:
        max_incidents: {{ .Values.storage.file.maxIncidents | default 1000 }}
      {{- else if eq (include "versus-incident.storageType" .) "postgres" }}
      postgres:
        dsn: ${POSTGRES_DSN}
      {{- end }}

    alert:
      debug_body: {{ .Values.alert.debugBody }}

      slack:
        enable: {{ .Values.alert.slack.enable }}
        token: ${SLACK_TOKEN}
        channel_id: ${SLACK_CHANNEL_ID}
        template_path: "/app/config/slack_message.tmpl"
        {{- if .Values.alert.slack.messageProperties }}
        message_properties:
          {{- if .Values.alert.slack.messageProperties.buttonText }}
          button_text: "{{ .Values.alert.slack.messageProperties.buttonText }}"
          {{- end }}
          {{- if .Values.alert.slack.messageProperties.buttonStyle }}
          button_style: "{{ .Values.alert.slack.messageProperties.buttonStyle }}"
          {{- end }}
          {{- if .Values.alert.slack.messageProperties.disableButton }}
          disable_button: {{ .Values.alert.slack.messageProperties.disableButton }}
          {{- end }}
        {{- end }}

      telegram:
        enable: {{ .Values.alert.telegram.enable }}
        bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        template_path: "/app/config/telegram_message.tmpl"
        use_proxy: {{ .Values.alert.telegram.useProxy | default false }}

      viber:
        enable: {{ .Values.alert.viber.enable }}
        bot_token: ${VIBER_BOT_TOKEN}
        user_id: ${VIBER_USER_ID}
        channel_id: ${VIBER_CHANNEL_ID}
        api_type: ${VIBER_API_TYPE}
        template_path: "/app/config/viber_message.tmpl"
        use_proxy: {{ .Values.alert.viber.useProxy | default false }}

      email:
        enable: {{ .Values.alert.email.enable }}
        smtp_host: ${SMTP_HOST}
        smtp_port: ${SMTP_PORT}
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        to: ${EMAIL_TO}
        subject: ${EMAIL_SUBJECT}
        template_path: "/app/config/email_message.tmpl"

      msteams:
        enable: {{ .Values.alert.msteams.enable }}
        power_automate_url: ${MSTEAMS_POWER_AUTOMATE_URL}
        template_path: "/app/config/msteams_message.tmpl"
        {{- if .Values.alert.msteams.otherPowerUrls }}
        other_power_urls:
          {{- range $key, $val := .Values.alert.msteams.otherPowerUrls }}
          {{ $key }}: ${MSTEAMS_OTHER_POWER_URL_{{ $key | upper }}}
          {{- end }}
        {{- end }}

      lark:
        enable: {{ .Values.alert.lark.enable }}
        webhook_url: ${LARK_WEBHOOK_URL}
        template_path: "/app/config/lark_message.tmpl"
        use_proxy: {{ .Values.alert.lark.useProxy | default false }}
        {{- if .Values.alert.lark.otherWebhookUrls }}
        other_webhook_urls:
          {{- range $key, $val := .Values.alert.lark.otherWebhookUrls }}
          {{ $key }}: ${LARK_OTHER_WEBHOOK_URL_{{ $key | upper }}}
          {{- end }}
        {{- end }}

    # Inbound queue sources. The server reads these from the top-level
    # `queue` block, not from `alert` — `alert` is outbound channels only.
    # The sns/sqs toggles stay under `alert.*` in values.yaml for backward
    # compatibility and are mapped in here.
    queue:
      enable: {{ or .Values.alert.sns.enable .Values.alert.sqs.enable }}
      debug_body: {{ dig "debugBody" true (.Values.queue | default dict) }}

      sns:
        enable: {{ .Values.alert.sns.enable }}
        {{- if .Values.alert.sns.httpsEndpointSubscriptionPath }}
        https_endpoint_subscription_path: {{ .Values.alert.sns.httpsEndpointSubscriptionPath }}
        {{- end }}
        {{- if .Values.alert.sns.httpsEndpointSubscription }}
        https_endpoint_subscription: ${SNS_HTTPS_ENDPOINT_SUBSCRIPTION}
        {{- end }}
        {{- if .Values.alert.sns.topicArn }}
        topic_arn: ${SNS_TOPIC_ARN}
        {{- end }}

      sqs:
        enable: {{ .Values.alert.sqs.enable }}
        {{- if .Values.alert.sqs.queueUrl }}
        queue_url: ${SQS_QUEUE_URL}
        {{- end }}

    {{- if or .Values.oncall.enable .Values.oncall.initializedOnly }}
    oncall:
      initialized_only: {{ .Values.oncall.initializedOnly }}
      enable: {{ .Values.oncall.enable }}
      wait_minutes: {{ .Values.oncall.waitMinutes }}
      provider: {{ .Values.oncall.provider }}
      
      {{- if eq .Values.oncall.provider "aws_incident_manager" }}
      aws_incident_manager:
        response_plan_arn: ${AWS_INCIDENT_MANAGER_RESPONSE_PLAN_ARN}
        {{- if .Values.oncall.awsIncidentManager.otherResponsePlanArns }}
        other_response_plan_arns:
          {{- range $key, $val := .Values.oncall.awsIncidentManager.otherResponsePlanArns }}
          {{ $key }}: ${AWS_INCIDENT_MANAGER_OTHER_RESPONSE_PLAN_ARN_{{ $key | upper }}}
          {{- end }}
        {{- end }}
      {{- end }}
      
      {{- if eq .Values.oncall.provider "pagerduty" }}
      pagerduty:
        routing_key: ${PAGERDUTY_ROUTING_KEY}
        {{- if .Values.oncall.pagerduty.otherRoutingKeys }}
        other_routing_keys:
          {{- range $key, $val := .Values.oncall.pagerduty.otherRoutingKeys }}
          {{ $key }}: ${PAGERDUTY_OTHER_ROUTING_KEY_{{ $key | upper }}}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if eq .Values.oncall.provider "servicenow" }}
      servicenow:
        instance_url: ${SERVICENOW_INSTANCE_URL}
        username: ${SERVICENOW_USERNAME}
        password: ${SERVICENOW_PASSWORD}
        table: {{ .Values.oncall.servicenow.table | default "incident" }}
        {{- if .Values.oncall.servicenow.otherInstanceUrls }}
        other_instance_urls:
          {{- range $key, $val := .Values.oncall.servicenow.otherInstanceUrls }}
          {{ $key }}: ${SERVICENOW_OTHER_INSTANCE_URL_{{ $key | upper }}}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if eq .Values.oncall.provider "incident_io" }}
      incident_io:
        api_key: ${INCIDENTIO_API_KEY}
        alert_source_config_id: ${INCIDENTIO_ALERT_SOURCE_CONFIG_ID}
        {{- if .Values.oncall.incidentIo.otherAlertSourceConfigIds }}
        other_alert_source_config_ids:
          {{- range $key, $val := .Values.oncall.incidentIo.otherAlertSourceConfigIds }}
          {{ $key }}: ${INCIDENTIO_OTHER_ALERT_SOURCE_CONFIG_ID_{{ $key | upper }}}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}

    # Redis Configuration Section - required for on-call functionality
    redis:
      {{- if .Values.redis.enabled }}
      # Configuration for built-in Redis
      insecure_skip_verify: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      db: 0
      {{- else }}
      # Configuration for external Redis
      insecure_skip_verify: {{ .Values.externalRedis.insecureSkipVerify }}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      db: {{ .Values.externalRedis.db }}
      {{- if .Values.externalRedis.connectionTimeout }}
      connection_timeout: {{ .Values.externalRedis.connectionTimeout }}
      {{- end }}
      {{- if .Values.externalRedis.readTimeout }}
      read_timeout: {{ .Values.externalRedis.readTimeout }}
      {{- end }}
      {{- if .Values.externalRedis.writeTimeout }}
      write_timeout: {{ .Values.externalRedis.writeTimeout }}
      {{- end }}
      {{- if .Values.externalRedis.maxRetries }}
      max_retries: {{ .Values.externalRedis.maxRetries }}
      {{- end }}
      {{- if .Values.externalRedis.minRetryBackoff }}
      min_retry_backoff: {{ .Values.externalRedis.minRetryBackoff }}
      {{- end }}
      {{- if .Values.externalRedis.maxRetryBackoff }}
      max_retry_backoff: {{ .Values.externalRedis.maxRetryBackoff }}
      {{- end }}
      {{- /* RedisConfig.TLS is a scalar flag, so the certificate material
             cannot nest under it — the paths ride alongside and reach the
             client through the REDIS_TLS_* env vars. */}}
      tls: {{ .Values.externalRedis.tls.enabled }}
      {{- if .Values.externalRedis.tls.enabled }}
      {{- if .Values.externalRedis.tls.caFile }}
      tls_ca_file: ${REDIS_TLS_CA_FILE}
      {{- end }}
      {{- if .Values.externalRedis.tls.certFile }}
      tls_cert_file: ${REDIS_TLS_CERT_FILE}
      {{- end }}
      {{- if .Values.externalRedis.tls.keyFile }}
      tls_key_file: ${REDIS_TLS_KEY_FILE}
      {{- end }}
      {{- end }}
      {{- end }}

    {{- if .Values.agent.enable }}
    {{- $agent := .Values.agent }}
    {{- $redaction := $agent.redaction | default dict }}
    {{- $catalog := $agent.catalog | default dict }}
    {{- $miner := $agent.miner | default dict }}
    {{- $regex := $agent.regex | default dict }}
    {{- $ai := $agent.ai | default dict }}
    # AI SRE Agent — opt-in. See src/agent/ai-detect-mode.md
    agent:
      enable: true
      mode: {{ $agent.mode | default "training" }}
      poll_interval: {{ $agent.pollInterval | default "30s" }}
      lookback: {{ $agent.lookback | default "5m" }}
      new_service_grace: {{ $agent.newServiceGrace | default "30m" }}
      batch_max: {{ $agent.batchMax | default 5000 }}
      signal_max_bytes: {{ $agent.signalMaxBytes | default 65536 }}
      sources_path: /app/config/agent_sources.yaml
      service_patterns:
      {{- if $agent.servicePatterns }}
{{ toYaml $agent.servicePatterns | indent 8 }}
      {{- else }}
        []
      {{- end }}
      # Scrubs every message before it is mined, stored, or sent to an LLM.
      redaction:
        enable: {{ dig "enable" true $redaction }}
        redact_ips: {{ dig "redactIps" false $redaction }}
        extra_patterns:
        {{- if $redaction.extraPatterns }}
{{ toYaml $redaction.extraPatterns | indent 10 }}
        {{- else }}
          []
        {{- end }}
      catalog:
        persist_interval: {{ $catalog.persistInterval | default "30s" }}
        auto_promote_after: {{ $catalog.autoPromoteAfter | default 100 }}
        spike_z: {{ dig "spikeZ" 3.0 $catalog }}
        spike_abs_ceiling: {{ dig "spikeAbsCeiling" 0 $catalog }}
        spike_sustain_ticks: {{ dig "spikeSustainTicks" 1 $catalog }}
        spike_min_frequency: {{ dig "spikeMinFrequency" 5 $catalog }}
        spike_min_baseline_count: {{ dig "spikeMinBaselineCount" 20 $catalog }}
      miner:
        similarity_threshold: {{ dig "similarityThreshold" 0.4 $miner }}
        tree_depth: {{ dig "treeDepth" 4 $miner }}
        max_children: {{ dig "maxChildren" 100 $miner }}
      regex:
        default_pattern: {{ $regex.defaultPattern | default "(?i).*error.*" | quote }}
        rules:
        {{- if $regex.rules }}
{{ toYaml $regex.rules | indent 10 }}
        {{- else }}
          []
        {{- end }}
      ai:
        enable: {{ $ai.enable }}
        provider: {{ $ai.provider | default "openai" | quote }}
        api_key: ${AGENT_AI_API_KEY}
        model: {{ $ai.model | default "gpt-4o-mini" | quote }}
        temperature: {{ $ai.temperature | default 0.2 }}
        max_tokens: {{ $ai.maxTokens | default 512 }}
        max_calls_per_hour: {{ $ai.maxCallsPerHour | default 60 }}
        cache_ttl: {{ $ai.cacheTtl | default "1h" | quote }}
        {{- if ($ai.analyze | default dict).model }}
        analyze:
          model: {{ $ai.analyze.model | quote }}
        {{- end }}
    {{- end }}

  {{- if .Values.agent.enable }}
  agent_sources.yaml: |
    sources:
      {{- if .Values.agent.sources }}
{{ toYaml .Values.agent.sources | indent 6 }}
      {{- else }}
      []
      {{- end }}
  {{- end }}

  {{- if .Values.agent.enable }}
  {{- $tools := .Values.agent.tools | default dict }}
  {{- $recentChanges := $tools.recentChanges | default dict }}
  {{- $git := $recentChanges.git | default dict }}
  {{- $describeDeps := $tools.describeDependencies | default dict }}
  {{- $findRunbook := $tools.findRunbook | default dict }}
  {{- $queryMetrics := ($tools.queryMetrics | default dict).prometheus | default dict }}
  {{- $queryTraces := ($tools.queryTraces | default dict).tempo | default dict }}
  tools.yaml: |
    # Per-tool DATA config for the analyze tools (rendered by Helm).
    # Credentials are NOT written here — they are injected as env vars from
    # the chart Secret and expanded by the loader at boot.
    tools:
      tool_timeout: {{ $tools.toolTimeout | default "20s" | quote }}
      parallel_tools: {{ dig "parallelTools" false $tools }}
      recent_changes:
        git:
          auth:
            token: "${GIT_AUTH_TOKEN}"
            ssh_key_path: {{ ($git.auth | default dict).sshKeyPath | default "" | quote }}
          repos:
          {{- if $git.repos }}
          {{- range $i, $repo := $git.repos }}
            - url: {{ $repo.url | quote }}
              {{- if $repo.branch }}
              branch: {{ $repo.branch | quote }}
              {{- end }}
              {{- if $repo.service }}
              service: {{ $repo.service | quote }}
              {{- end }}
              {{- if $repo.auth }}
              auth:
                token: "${GIT_AUTH_TOKEN_{{ $i }}}"
                ssh_key_path: {{ $repo.auth.sshKeyPath | default "" | quote }}
              {{- end }}
          {{- end }}
          {{- else }}
            []
          {{- end }}
      describe_dependencies:
        services:
        {{- if $describeDeps.services }}
        {{- range $describeDeps.services }}
          - name: {{ .name | quote }}
            depends_on:
            {{- if .dependsOn }}
            {{- range .dependsOn }}
              - {{ . | quote }}
            {{- end }}
            {{- else }}
              []
            {{- end }}
        {{- end }}
        {{- else }}
          []
        {{- end }}
      find_runbook:
        embedding_model: {{ $findRunbook.embeddingModel | default "" | quote }}
      query_metrics:
        prometheus:
          address: {{ $queryMetrics.address | default "" | quote }}
          bearer_token: "${QUERY_METRICS_PROMETHEUS_BEARER_TOKEN}"
          username: {{ $queryMetrics.username | default "" | quote }}
          password: "${QUERY_METRICS_PROMETHEUS_PASSWORD}"
          insecure_skip_verify: {{ dig "insecureSkipVerify" false $queryMetrics }}
      query_traces:
        tempo:
          address: {{ $queryTraces.address | default "" | quote }}
          bearer_token: "${QUERY_TRACES_TEMPO_BEARER_TOKEN}"
          username: {{ $queryTraces.username | default "" | quote }}
          password: "${QUERY_TRACES_TEMPO_PASSWORD}"
          insecure_skip_verify: {{ dig "insecureSkipVerify" false $queryTraces }}
  {{- end }}

  {{- if .Values.templates.slack }}
  slack_message.tmpl: |
{{ .Values.templates.slack | indent 4 }}
  {{- end }}

  {{- if .Values.templates.telegram }}
  telegram_message.tmpl: |
{{ .Values.templates.telegram | indent 4 }}
  {{- end }}

  {{- if .Values.templates.msteams }}
  msteams_message.tmpl: |
{{ .Values.templates.msteams | indent 4 }}
  {{- end }}

  {{- if .Values.templates.email }}
  email_message.tmpl: |
{{ .Values.templates.email | indent 4 }}
  {{- end }}

  {{- if .Values.templates.lark }}
  lark_message.tmpl: |
{{ .Values.templates.lark | indent 4 }}
  {{- end }}
