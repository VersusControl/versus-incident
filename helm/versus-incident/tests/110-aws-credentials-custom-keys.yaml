# The Secret's own key names, an unquoted account ID in a values file (read as
# a float) and no regions, so every region is read.
connectors:
  aws:
    enable: true
    credentials:
      existingSecret: team-aws-keys
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
    accounts:
      - accountId: 444455556666
