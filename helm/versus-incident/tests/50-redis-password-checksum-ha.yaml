# Scenario 49 with another password, on the HA StatefulSet: the checksum
# changes and the StatefulSet pods carry it too.
replicaCount: 2
gatewaySecret: "test-secret-do-not-use-in-prod"
image:
  repository: ghcr.io/versuscontrol/versus-enterprise
  tag: dev
ha:
  enabled: true
storage:
  type: postgres
  postgres:
    dsn: "postgres://versus:pass@pg:5432/versus?sslmode=require"
enterprise:
  licenseKey: "PLACEHOLDER-NOT-A-REAL-KEY"
oncall:
  enable: true
  provider: pagerduty
  pagerduty:
    routingKey: "test-routing-key"
redis:
  enabled: true
  auth:
    password: "checksum-two"
