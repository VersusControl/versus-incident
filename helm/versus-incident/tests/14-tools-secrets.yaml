# Analyze tools with credentials: a git PAT (global + per-repo override),
# a Prometheus bearer token and a Tempo basic-auth password. None of these
# may appear as literals in the ConfigMap — they must be env refs backed by
# the chart Secret.
replicaCount: 1
gatewaySecret: "test-secret-do-not-use-in-prod"

agent:
  enable: true
  mode: detect
  ai:
    enable: true
    apiKey: "sk-test-key"
  tools:
    kubernetes:
      endpoint: https://10.20.30.40:6443
      caData: kube-ca-literal-data
      allowPrivateNetworks: true
      endpointCIDRs: [10.20.0.0/16]
      auth:
        mode: aks
        token: kube-literal-token
        eks:
          clusterName: production
          region: us-east-1
          roleARN: arn:aws:iam::123456789012:role/reader
          profile: production
        aks:
          credentialMode: client_secret
          serverID: api://aks-server
          tenantID: tenant-id
          clientID: client-id
          clientSecret: aks-literal-client-secret
          federatedTokenFile: /var/run/secrets/azure/tokens/identity-token
          environment: government
        gke:
          credentialsFile: /var/run/secrets/google/credentials.json
    recentChanges:
      git:
        auth:
          token: "ghp-global-literal-token"
        repos:
          - url: https://github.com/acme/api.git
            branch: main
            service: api
          - url: https://github.com/acme/web.git
            auth:
              token: "ghp-per-repo-literal-token"
    queryMetrics:
      prometheus:
        address: "http://prometheus:9090"
        bearerToken: "prom-literal-bearer"
        username: "prom-user"
        password: "prom-literal-password"
    queryTraces:
      tempo:
        address: "http://tempo:3200"
        bearerToken: "tempo-literal-bearer"
        username: "tempo-user"
        password: "tempo-literal-password"

kubernetesReaderRBAC:
  enabled: true
