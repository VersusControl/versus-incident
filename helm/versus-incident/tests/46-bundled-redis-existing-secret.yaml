# Bundled Redis with the password from a Secret the user creates, and no
# volume: the chart creates no Redis Secret and no PVC.
oncall:
  enable: true
  provider: pagerduty
  pagerduty:
    routingKey: "test-routing-key"
redis:
  enabled: true
  auth:
    existingSecret: my-redis
    existingSecretPasswordKey: password
  persistence:
    enabled: false
