name: PROD - Build and Push Docker Image

on:
  push:
    tags: [ "v*" ]

jobs:
  # The release tag must be "v" + the chart appVersion (and the chart version),
  # because the chart and the one-file manifest pull the image tagged
  # "v<appVersion>". A mismatch would publish a chart pointing at another image.
  chart-version:
    name: Chart version matches tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare tag with Chart.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chart=helm/versus-incident/Chart.yaml
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          if [ "$TAG" != "v$app_version" ] || [ "$version" != "$app_version" ]; then
            echo "::error file=$chart::Tag $TAG needs Chart.yaml version and appVersion ${TAG#v} (found version $version, appVersion $app_version)"
            exit 1
          fi
          echo "Tag $TAG matches Chart.yaml version and appVersion"

  build-and-push:
    needs: [chart-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/versuscontrol/versus-incident
        tags: |
          type=raw,value=latest
          type=raw,value=${{ github.ref_name }}
        labels: |
          org.opencontainers.image.title=versus-incident
          org.opencontainers.image.description=Open-source incident router with built-in AI SRE agent
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.licenses=MIT

    - name: Build and Push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
