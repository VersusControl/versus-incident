name: DEV - Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # ui/embed.go uses `go:embed all:dist`, which fails to compile if
      # ui/dist/ is empty. The repo ships a committed ui/dist/.gitkeep
      # so this should always exist, but re-create it in CI as a guard
      # in case it ever gets deleted.
      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Coverage run without the race detector: plain instrumentation keeps
      # wall-clock waits in tests realistic. The race detector runs in the
      # sharded race job below; atomic covermode is only needed under -race.
      - name: Test
        run: go test -short -count=1 -timeout 15m -coverprofile=coverage.out -covermode=set ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Build the release Dockerfile on every pull request and push without pushing
  # the image. `go build ./...` compiles packages, so it cannot catch a
  # Dockerfile that builds a narrower target than the package.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build

  # Race detector run, split into shards that run in parallel so each one
  # finishes well inside its timeout on a default hosted runner. The slowest
  # packages under -race get their own shard; "rest" is every other package.
  race:
    name: Race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [kubernetes, storage-controllers, rest]
    env:
      GORACE: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      - name: Race test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            kubernetes)
              packages="./pkg/kubernetes/..."
              ;;
            storage-controllers)
              packages="./pkg/storage/... ./pkg/controllers/..."
              ;;
            rest)
              packages=$(go list ./... | grep -v -E '/pkg/(kubernetes|storage|controllers)(/|$)')
              ;;
            *)
              echo "::error::Unknown race shard: $SHARD"
              exit 1
              ;;
          esac
          if [ -z "$packages" ]; then
            echo "::error::Race shard $SHARD selected no packages"
            exit 1
          fi
          # Word splitting of the package list is intended.
          # shellcheck disable=SC2086
          go test -short -race -count=1 -timeout 20m $packages

  # Helm chart checks that run on every change, not only on chart edits: the
  # chart version must follow the release version, the committed one-file
  # kubectl manifest must match a fresh render of the chart, and the chart
  # must lint and pass its template scenarios.
  chart:
    name: Chart & manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Helm version the committed manifest is rendered with, so the
      # freshness check compares like with like.
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.3

      # The scenario runner ends with Go checks that read its renders: the
      # chart config through the application's config loader and key set, and
      # the reader role against what the Kubernetes connector reads.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      # Chart version and appVersion move together with the release. The
      # release tag itself is checked in the release workflow.
      - name: Chart version matches appVersion
        run: |
          chart=helm/versus-incident/Chart.yaml
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          if [ -z "$version" ] || [ -z "$app_version" ]; then
            echo "::error file=$chart::Could not read version and appVersion"
            exit 1
          fi
          if [ "$version" != "$app_version" ]; then
            echo "::error file=$chart::Chart version $version differs from appVersion $app_version"
            exit 1
          fi
          echo "Chart version and appVersion are both $version"

      - name: One-file manifests are up to date
        run: scripts/render_kubernetes_manifest.sh --check

      # Each example values file must lint and render on its own, with only
      # the sign-in Secret reference the examples ask for at install time.
      - name: Example values files lint and render
        run: |
          for values in examples/kubernetes/values-*.yaml; do
            echo "== $values"
            helm lint helm/versus-incident \
              -f "$values" \
              --set gatewaySecretExistingSecret=versus-incident
            helm template versus-incident helm/versus-incident \
              --namespace versus \
              -f "$values" \
              --set gatewaySecretExistingSecret=versus-incident >/dev/null
          done

      - name: helm lint
        run: helm lint helm/versus-incident

      - name: Chart template scenarios
        run: ./helm/versus-incident/tests/run.sh

  # Contract tests against the AWS Emulator, a local stand-in for the AWS APIs
  # the collectors call. The emulator is a native binary unpacked from AWS's
  # RPM, so the job needs no Docker. It stays apart from the product jobs: an
  # emulator bug fails only this job, and plain `go test ./...` never builds
  # these tests because they need the awsemulator build tag. The job holds no
  # real AWS credentials and keeps the emulator's telemetry off.
  aws-emulator:
    name: AWS emulator contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # AWS publishes the package only under a "latest" URL, so the checksum
      # is the version pin: a new upstream release fails the checksum step.
      # Bump EMU_VERSION and EMU_RPM_SHA256 together, after re-checking the
      # contract tests against the new release.
      EMU_VERSION: '1.0.385'
      EMU_RPM_SHA256: 2b2b5031e559d74c7a4154b11056be3a57716a177cd796cf058eebd91a6870d7
      EMU_RPM_URL: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator-x86_64.rpm
      EMU_PORT: '9297'
      EMULATOR_TELEMETRY: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      - name: Restore emulator package
        id: emu-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/aws-emulator/aws-emulator-x86_64.rpm
          key: aws-emulator-${{ env.EMU_VERSION }}-x86_64-${{ env.EMU_RPM_SHA256 }}

      - name: Download emulator package
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/aws-emulator
          curl -fsSL --retry 3 -o ~/.cache/aws-emulator/aws-emulator-x86_64.rpm "$EMU_RPM_URL"

      # Runs on every job, cached or not, so a changed upstream package or a
      # damaged cache entry never reaches the tests.
      - name: Verify emulator package checksum
        run: |
          rpm=~/.cache/aws-emulator/aws-emulator-x86_64.rpm
          if ! echo "$EMU_RPM_SHA256  $rpm" | sha256sum -c -; then
            echo "::error::The emulator package does not match the pinned checksum: AWS has published a new release. Re-check the contract tests against it, then bump EMU_VERSION and EMU_RPM_SHA256 together."
            exit 1
          fi

      # Saved straight after the checksum passes, so a failing test run still
      # leaves the verified package cached for the next one.
      - name: Save emulator package
        if: steps.emu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/aws-emulator/aws-emulator-x86_64.rpm
          key: aws-emulator-${{ env.EMU_VERSION }}-x86_64-${{ env.EMU_RPM_SHA256 }}

      # rpm2cpio and cpio unpack the package; the seed script zips its Lambda
      # code. Installed only when the runner image lacks them.
      - name: Install unpack and seed tools
        run: |
          missing=""
          for tool in rpm2cpio cpio zip; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            sudo apt-get update -qq
            # Word splitting of the package list is intended.
            # shellcheck disable=SC2086
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing >/dev/null
          fi

      - name: Unpack emulator
        run: |
          dir="$RUNNER_TEMP/aws-emulator"
          mkdir -p "$dir"
          rpm2cpio ~/.cache/aws-emulator/aws-emulator-x86_64.rpm | (cd "$dir" && cpio -idm --quiet)
          bin="$dir/opt/aws-emulator/bin/aws-emulator"
          version=$("$bin" -v | awk '/^Version:/ {print $2}')
          if [ "$version" != "$EMU_VERSION" ]; then
            echo "::error::The unpacked emulator reports version '$version', expected $EMU_VERSION"
            exit 1
          fi
          echo "EMU_BIN=$bin" >> "$GITHUB_ENV"

      # Loopback only, its own home folder, telemetry off by both the
      # environment and the flag, and an idle timeout so a stuck job cannot
      # keep it running. The emulator writes per-run keys and a CA there.
      - name: Start emulator
        run: |
          unset AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          home="$RUNNER_TEMP/aws-emulator-home"
          mkdir -p "$home"
          HOME="$home" nohup "$EMU_BIN" -b 127.0.0.1 -p "$EMU_PORT" --telemetry off --idle-timeout 900 \
            > "$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aws-emulator.pid"
          state="$home/.aws/emulator/$EMU_PORT"
          endpoint="https://127.0.0.1:$EMU_PORT"
          ready=false
          for _ in $(seq 30); do
            if [ -f "$state/ca.pem" ] && curl -sf --cacert "$state/ca.pem" "$endpoint/__admin/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The emulator did not report healthy within 30 seconds"
            exit 1
          fi
          creds="$state/emulator_credentials"
          key_id=$(awk -F' *= *' '$1 == "aws_access_key_id" {print $2; exit}' "$creds")
          secret=$(awk -F' *= *' '$1 == "aws_secret_access_key" {print $2; exit}' "$creds")
          if [ -z "$key_id" ] || [ -z "$secret" ]; then
            echo "::error::Could not read the emulator's per-run keys from $creds"
            exit 1
          fi
          echo "::add-mask::$secret"
          {
            echo "VERSUS_HARNESS_AWS_ENDPOINT_URL=$endpoint"
            echo "VERSUS_HARNESS_AWS_CA_BUNDLE=$state/ca.pem"
            echo "AWS_ACCESS_KEY_ID=$key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "AWS_REGION=us-east-1"
            echo "AWS_EC2_METADATA_DISABLED=true"
          } >> "$GITHUB_ENV"

      # The AWS CLI on the runner image does the seeding. Only this step gets
      # the CLI's own endpoint and CA variables; the tests reach the emulator
      # through the harness endpoint variables alone.
      - name: Seed emulator
        env:
          AWS_ENDPOINT_URL: ${{ env.VERSUS_HARNESS_AWS_ENDPOINT_URL }}
          AWS_CA_BUNDLE: ${{ env.VERSUS_HARNESS_AWS_CA_BUNDLE }}
        run: |
          aws --version
          bash tests/awsemulator/seed.sh

      - name: Contract tests
        run: |
          if ! find tests/awsemulator -name '*_test.go' | grep -q .; then
            echo "::notice::tests/awsemulator has no Go tests yet; nothing to run"
            exit 0
          fi
          go test -tags 'awsemulator harness_awsendpoint' -timeout 8m ./tests/awsemulator/...

      - name: Stop emulator
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/aws-emulator.pid"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aws-emulator-log
          path: ${{ runner.temp }}/aws-emulator.log
          if-no-files-found: ignore
          retention-days: 7

  build-and-push-dev:
    name: Build & push dev image
    runs-on: ubuntu-latest
    needs: [test, race, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/versuscontrol/versus-incident
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short
          labels: |
            org.opencontainers.image.title=versus-incident
            org.opencontainers.image.description=Open-source incident router with built-in AI SRE agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
