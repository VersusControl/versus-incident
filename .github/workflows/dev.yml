name: DEV - Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # ui/embed.go uses `go:embed all:dist`, which fails to compile if
      # ui/dist/ is empty. The repo ships a committed ui/dist/.gitkeep
      # so this should always exist, but re-create it in CI as a guard
      # in case it ever gets deleted.
      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Coverage run without the race detector: plain instrumentation keeps
      # wall-clock waits in tests realistic. The race detector runs in the
      # sharded race job below; atomic covermode is only needed under -race.
      - name: Test
        run: go test -short -count=1 -timeout 15m -coverprofile=coverage.out -covermode=set ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Race detector run, split into shards that run in parallel so each one
  # finishes well inside its timeout on a default hosted runner. The slowest
  # packages under -race get their own shard; "rest" is every other package.
  race:
    name: Race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [kubernetes, storage-controllers, rest]
    env:
      GORACE: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      - name: Race test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            kubernetes)
              packages="./pkg/kubernetes/..."
              ;;
            storage-controllers)
              packages="./pkg/storage/... ./pkg/controllers/..."
              ;;
            rest)
              packages=$(go list ./... | grep -v -E '/pkg/(kubernetes|storage|controllers)(/|$)')
              ;;
            *)
              echo "::error::Unknown race shard: $SHARD"
              exit 1
              ;;
          esac
          if [ -z "$packages" ]; then
            echo "::error::Race shard $SHARD selected no packages"
            exit 1
          fi
          # Word splitting of the package list is intended.
          # shellcheck disable=SC2086
          go test -short -race -count=1 -timeout 20m $packages

  # Helm chart checks that run on every change, not only on chart edits: the
  # chart version must follow the release version, the committed one-file
  # kubectl manifest must match a fresh render of the chart, and the chart
  # must lint and pass its template scenarios.
  chart:
    name: Chart & manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Helm version the committed manifest is rendered with, so the
      # freshness check compares like with like.
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.3

      # The scenario runner ends with a Go test that compares the rendered
      # chart config with the application's default config.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Ensure ui/dist placeholder exists
        run: |
          mkdir -p ui/dist
          touch ui/dist/.gitkeep

      # Chart version and appVersion move together with the release. The
      # release tag itself is checked in the release workflow.
      - name: Chart version matches appVersion
        run: |
          chart=helm/versus-incident/Chart.yaml
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$chart")
          if [ -z "$version" ] || [ -z "$app_version" ]; then
            echo "::error file=$chart::Could not read version and appVersion"
            exit 1
          fi
          if [ "$version" != "$app_version" ]; then
            echo "::error file=$chart::Chart version $version differs from appVersion $app_version"
            exit 1
          fi
          echo "Chart version and appVersion are both $version"

      # charts/ is not committed; fetch the redis subchart at the version and
      # digest pinned in Chart.lock.
      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build helm/versus-incident

      - name: One-file manifest is up to date
        run: scripts/render_kubernetes_manifest.sh --check

      - name: helm lint
        run: helm lint helm/versus-incident

      - name: Chart template scenarios
        run: ./helm/versus-incident/tests/run.sh

  build-and-push-dev:
    name: Build & push dev image
    runs-on: ubuntu-latest
    needs: [test, race, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/versuscontrol/versus-incident
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short
          labels: |
            org.opencontainers.image.title=versus-incident
            org.opencontainers.image.description=Open-source incident router with built-in AI SRE agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
