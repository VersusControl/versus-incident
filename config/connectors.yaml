# Optional connector settings. When this file holds settings it replaces any
# inline `connectors:` block in config.yaml; while it holds only comments it is
# ignored and the inline block is used. It is not shipped in the container
# image: mount your own file at /app/config/connectors.yaml, or configure
# `connectors:` inline in config.yaml.
#
# Single cluster, read with the pod ServiceAccount:
# connectors:
#   kubernetes:
#     auth:
#       mode: in_cluster
#     actions:
#       enable: false
#
# Multi-cluster form replaces the single connection block above.
# connectors:
#   kubernetes:
#     multiple: true
#     clusters:
#       - cluster_id: production
#         display_name: Production
#         endpoint: https://production.example
#         auth: {mode: token_file, token_file: /run/k8s/production/token}
#       - cluster_id: staging
#         endpoint: https://staging.example
#         auth: {mode: token_file, token_file: /run/k8s/staging/token}
