# tools.yaml — per-tool configuration for the AI SRE Agent's analyze tools.
#
# This file is loaded automatically when it sits next to the main config
# file (config.yaml). It is OPTIONAL: with no file (or an empty section) a
# tool that needs external data simply degrades to a clean "nothing found"
# and the analysis proceeds without it.
#
# This file holds per-tool DATA configuration only. It is NOT a tool
# allow-list: tools are registered in code (analyzetools.Default), and a
# missing config block just means the tool has no data to read.


tools:
  # Shared tool-loop knobs (apply to every analyze tool dispatch).
  tool_timeout: 20s     # cap per tool dispatch; empty/"0"/invalid = 20s default
  parallel_tools: false # run tool calls in one model turn concurrently (off = sequential)

  # Kubernetes is disabled by default. Select exactly one auth.mode. Every mode
  # is implemented in Go; no cloud CLI or Kubernetes auth plugin is executed.
  # Except for in_cluster, the endpoint and CA are operator-provided. Private
  # endpoints also require allow_private_networks or endpoint_cidrs.
  kubernetes:
    auth:
      mode: ""

    # In-cluster ServiceAccount token and CA:
    # auth:
    #   mode: in_cluster

    # Rotating token file:
    # endpoint: https://api.example
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: token_file
    #   token_file: /run/secrets/kubernetes/token

    # Static token, normally expanded from an environment-backed Secret:
    # endpoint: https://api.example
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: token
    #   token: ${KUBERNETES_TOKEN}

    # Client certificate files (certificate_data/key_data are also supported):
    # endpoint: https://api.example
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: client_certificate
    #   client_certificate:
    #     certificate_file: /run/secrets/kubernetes/client.crt
    #     key_file: /run/secrets/kubernetes/client.key

    # Safe kubeconfig. Only token, tokenFile, or client cert/key users are read:
    # auth:
    #   mode: kubeconfig
    #   kubeconfig:
    #     path: /run/secrets/kubernetes/config
    #     context: production

    # EKS IAM uses a closed native chain: environment credentials, IRSA,
    # static credentials from the selected profile, constrained container
    # credentials, then fixed IPv4 IMDSv2. Credential processes, SSO, profile
    # role/source chains, web-identity directives, plugins, and endpoint/service
    # overrides are rejected. Benign CLI output/pager/retry settings are ignored.
    # Optional YAML role_arn uses native STS AssumeRole.
    # endpoint: https://API_ID.eks.us-east-1.amazonaws.com
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: eks
    #   eks:
    #     cluster_name: production
    #     region: us-east-1
    #     role_arn: arn:aws:iam::123456789012:role/versus-kubernetes-reader
    #     profile: ""

    # AKS workload identity:
    # endpoint: https://production.example.azmk8s.io
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: aks
    #   aks:
    #     credential_mode: workload_identity
    #     environment: public
    #     server_id: api://AKS_SERVER_APP_ID
    #     tenant_id: TENANT_ID
    #     client_id: CLIENT_ID
    #     federated_token_file: /var/run/secrets/azure/tokens/azure-identity-token

    # AKS client secret:
    # endpoint: https://production.example.azmk8s.io
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: aks
    #   aks:
    #     credential_mode: client_secret
    #     environment: public
    #     server_id: api://AKS_SERVER_APP_ID
    #     tenant_id: TENANT_ID
    #     client_id: CLIENT_ID
    #     client_secret: ${KUBERNETES_AKS_CLIENT_SECRET}

    # AKS managed identity:
    # endpoint: https://production.example.azmk8s.io
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: aks
    #   aks:
    #     credential_mode: managed_identity
    #     environment: public
    #     server_id: api://AKS_SERVER_APP_ID
    #     client_id: OPTIONAL_USER_ASSIGNED_IDENTITY_CLIENT_ID

    # GKE uses only the fixed metadata IP for Workload Identity when
    # credentials_file is empty. Set credentials_file explicitly for supported
    # service-account or file-backed external-account JSON. Ambient
    # GOOGLE_APPLICATION_CREDENTIALS and GCE_METADATA_HOST are rejected in
    # every mode, and well-known gcloud ADC files are never discovered.
    # endpoint: https://GKE_CONTROL_PLANE_ENDPOINT
    # ca_file: /run/secrets/kubernetes/ca.crt
    # auth:
    #   mode: gke
    #   gke:
    #     credentials_file: /run/secrets/google/credentials.json

  # ---------------------------------------------------------------------------
  # recent_changes — correlate an incident with recent deploys / config changes
  # ---------------------------------------------------------------------------
  # The recent_changes tool reads one or more REMOTE git repositories' commit
  # histories (the deploy/change record most teams already keep). Each repo is
  # mirror-cloned into a local cache on first use and fetched on later lookups.
  # It shells out to the `git` binary, which MUST be available on PATH. Private
  # remotes authenticate via the optional `auth` block: a global default under
  # `git.auth` applies to every repo, and each repo may override it with its own
  # `auth`. With an empty `repos` list the tool is not registered.
  #
  # recent_changes:
  #   git:
  #     auth:                       # global default auth (optional)
  #       token: ${GIT_TOKEN}       # HTTPS access token / PAT
  #       ssh_key_path: ""          # path to a private SSH key
  #     repos:
  #       - url: https://github.com/acme/api.git  # remote clone URL (required)
  #         branch: main                          # optional; empty = default HEAD
  #         service: api                          # optional; empty = derived from URL
  #         auth:                                 # optional; overrides git.auth
  #           token: ${ACME_API_TOKEN}
  recent_changes:
    git:
      auth:             # global default auth; empty = ambient git credentials
        token: ""         # HTTPS access token / PAT (e.g. ${GIT_TOKEN})
        ssh_key_path: ""  # path to a private SSH key for ssh/scp-like remotes
      repos: []   # empty leaves recent_changes unregistered
        # - url: https://github.com/acme/api.git
        #   branch: main          # optional; empty = default HEAD
        #   service: api          # optional; empty = auto-detected from repo name
        # - url: git@github.com:acme/web.git   # service auto-detected as "web"
        #   auth:                 # optional; per-repo override of git.auth
        #     ssh_key_path: /home/versus/.ssh/web_deploy

  # -------------------------------------------------------------------------
  # describe_dependencies — surface a service's upstream/downstream neighbours
  # -------------------------------------------------------------------------
  # An optional service-dependency graph. With an empty `services` list the
  # describe_dependencies tool is simply not registered and analyses proceed
  # without dependency awareness.
  #
  # Schema (minimal):
  #   services:
  #     - name: <service-name>        # the service node
  #       depends_on:                 # upstream services this one relies on
  #         - <other-service-name>
  #
  # Only `depends_on` (upstream edges) is authored by hand. The reverse edges
  # (`depended_on_by`, i.e. downstream consumers) are derived automatically.
  describe_dependencies:
    services: []
    #  - name: web
    #    depends_on:
    #      - api
    #  - name: api
    #    depends_on:
    #      - database
    #      - cache
    #  - name: worker
    #    depends_on:
    #      - database
    #      - queue

  # -------------------------------------------------------------------------
  # find_runbook — ground the analysis in the team's own remediation docs
  # -------------------------------------------------------------------------
  # The find_runbook tool runs a read-only vector search over a corpus of
  # Markdown runbooks you ingest ahead of time. During an investigation it
  # embeds a (redacted) query, finds the most similar runbook excerpts, and
  # returns them so the model can cite your team's real remediation steps.
  # It is SEARCH-ONLY: it never executes any remediation.
  #
  # Two-step setup:
  #   1. Configure the embedding model below.
  #   2. Place your `*.md` runbooks in the data folder under `runbooks/`
  #      (./data/runbooks; /app/data/runbooks in the container image).
  #      The server auto-ingests them at boot — it scans `*.md` files,
  #      embeds new or edited ones, and persists the vectors.
  #
  # The tool is registered ONLY when embedding_model is set AND a storage
  # backend is available. With no embedding_model the tool is omitted and
  # analyses proceed without runbook grounding (community default).
  #
  # SECURITY: embedding a query is an external trust boundary, identical to
  # the chat-completion call. The query is scrubbed through the same redactor
  # (redaction.* in config.yaml) BEFORE it is embedded. To keep embeddings
  # fully inside your own network, set agent.ai.provider to ollama (or gemini)
  # — the embedder selects its backend from the same provider as the chat path.
  find_runbook:
    embedding_model: ""      # e.g. "text-embedding-3-small"; empty = tool omitted

