# Traces overlay: adds Tempo and the Enterprise traces source. Use it together
# with the base file:
#
#   export LICENSE_KEY=<your license key>           # never commit it
#   docker compose -f docker-compose.yml -f docker-compose.traces.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.traces.yml \
#     --profile fake-metrics up -d                  # traffic plus one span per push
#   docker compose -f docker-compose.yml -f docker-compose.traces.yml \
#     run --rm metrics-spike                        # error spans during the spike
#
# The generators send one OTLP span to Tempo with every push, so the traces
# source has spans to read. The Prometheus source keeps running as before.
services:
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  versus:
    depends_on:
      tempo:
        condition: service_healthy
    volumes:
      - ./config/agent_sources.traces.yaml:/app/config/agent_sources.yaml:ro

  metrics-generator:
    depends_on:
      tempo:
        condition: service_healthy
    environment:
      OTLP_ENDPOINT: http://tempo:4318

  metrics-spike:
    depends_on:
      tempo:
        condition: service_healthy
    environment:
      OTLP_ENDPOINT: http://tempo:4318

volumes:
  tempo-data:
