# Sources for the traces overlay (docker-compose.traces.yml): the same
# Prometheus source as agent_sources.yaml plus a Tempo traces source. This file
# is mounted over agent_sources.yaml only when the overlay is used.
#
# Both are Enterprise sources and need a license with the `intelligence`
# entitlement. The traces source finds each service and operation in Tempo,
# learns its error rate and latency, and raises an incident when one stays
# well outside its baseline. It also gives Chat and Analyze the
# `discover_trace_fields` and `read_trace_spans` tools.
sources:
  - name: demo-prom
    type: prometheus
    enable: true
    options:
      address: http://prometheus:9090
      step: 15s
      filter: '{service!=""}'
      discovery_interval: 1m

  - name: demo-traces
    type: traces
    enable: true
    options:
      backend: tempo
      address: http://tempo:3200
      # Tempo is on the private Docker network; tool reads must opt in to that.
      allow_private_networks: true
      # A TraceQL query you choose; the source learns its error rate and
      # latency as one extra target.
      query: '{ resource.service.name = "checkout" }'
      page_size: 100
      discovery_interval: 1m
