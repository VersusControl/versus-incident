# Prometheus source for the metrics-source example (Versus Enterprise).
#
# `type: prometheus` is an Enterprise source: it needs the Enterprise image and
# a license with the `intelligence` entitlement, otherwise it reports
# "requires Versus Enterprise".
#
# The source finds each service (here from the `service` label), picks its
# request rate, error rate and latency, learns a baseline for each, and raises
# an incident when a signal stays well outside its baseline. It also gives
# Chat and Analyze the `discover_metrics` and `read_metric_series` tools; no
# tools.yaml entry is needed.
sources:
  - name: demo-prom
    type: prometheus
    enable: true
    options:
      address: http://prometheus:9090
      # One sample every 15s, so a fresh baseline is ready in about 5 minutes.
      step: 15s
      # Learn only the demo series (they carry a `service` label), not
      # Prometheus's own metrics.
      filter: '{service!=""}'
      # Look for new services every minute (the default is hourly), so series
      # pushed after Versus starts are picked up quickly.
      discovery_interval: 1m
