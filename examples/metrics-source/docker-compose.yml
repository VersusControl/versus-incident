# Metrics source example: Versus Enterprise reading a local Prometheus.
#
#   export LICENSE_KEY=<your license key>           # never commit it
#   docker compose up -d                            # the stack
#   docker compose --profile fake-metrics up -d     # plus steady demo traffic
#   docker compose run --rm metrics-spike           # a 90s 5xx + latency spike,
#                                                   # after ~2 min of learning
#
# The Prometheus and traces sources are Enterprise features, so this example
# runs the Enterprise image. Without LICENSE_KEY it starts in community mode
# and the sources stay off. Ports bind to 127.0.0.1 only. See README.md.

services:
  # The demo generator pushes its series here and Prometheus scrapes them.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.1
    depends_on:
      pushgateway:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-versus}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-versus}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Enterprise keeps learned baselines in Postgres tables.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: versus
      POSTGRES_USER: versus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-versus-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "versus", "-d", "versus"]
      interval: 5s
      timeout: 3s
      retries: 10

  versus:
    image: ${VERSUS_ENTERPRISE_IMAGE:-ghcr.io/versuscontrol/versus-enterprise}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The license turns the sources on. Read from your shell or a local .env.
      LICENSE_KEY: ${LICENSE_KEY:-}
      # Licensed, you sign in as the built-in admin (the password is printed
      # once in the logs). Without a license the image runs in community mode
      # and this secret protects the admin API instead.
      GATEWAY_SECRET: ${GATEWAY_SECRET:-change-me}
      # Lets the session cookie work over plain HTTP on localhost. Local use only.
      VERSUS_ENTERPRISE_COOKIE_INSECURE: "1"
      STORAGE_TYPE: postgres
      POSTGRES_DSN: postgres://versus:${POSTGRES_PASSWORD:-versus-dev}@postgres:5432/versus?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-versus}
      REDIS_TLS: "false"
      # training | shadow | detect
      AGENT_ENABLE: "true"
      AGENT_MODE: ${AGENT_MODE:-detect}
      # AI is optional: the sources learn and detect without a key.
      AGENT_AI_ENABLE: ${AGENT_AI_ENABLE:-false}
      AGENT_AI_API_KEY: ${AGENT_AI_API_KEY:-}
      AGENT_AI_MODEL: ${AGENT_AI_MODEL:-gpt-4o-mini}
      # Slack and Telegram are optional.
      SLACK_ENABLE: ${SLACK_ENABLE:-false}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      TELEGRAM_ENABLE: ${TELEGRAM_ENABLE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # Mount single files so the templates shipped in the image stay in place.
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/agent_sources.yaml:/app/config/agent_sources.yaml:ro
      - versus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Optional demo traffic (profile fake-metrics): steady, healthy requests for
  # the `checkout` service, pushed every 2 seconds. Runs the example's
  # generator in a Python image, so no Python is needed on your machine.
  metrics-generator:
    image: python:3.12-alpine
    profiles: ["fake-metrics"]
    depends_on:
      pushgateway:
        condition: service_healthy
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        while true; do
          python3 -B /scripts/generate_fake_metrics.py --duration 0 || echo "push failed, retrying"
          sleep 5
        done
    restart: unless-stopped

  # One-shot (profile metrics-spike): 90 seconds of 5xx errors and slow
  # requests for the same service, pushed as a separate job so the steady
  # traffic keeps running. Run it once the baselines are confident (about two
  # minutes of steady traffic) and Versus raises an incident.
  #   docker compose run --rm metrics-spike
  metrics-spike:
    image: python:3.12-alpine
    profiles: ["metrics-spike"]
    depends_on:
      pushgateway:
        condition: service_healthy
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts:/scripts:ro
    command:
      - python3
      - -B
      - /scripts/generate_fake_metrics.py
      - --job
      - demo-spike
      - --spike
      - --duration
      - "90"

volumes:
  redis-data:
  postgres-data:
  versus-data:
  prometheus-data:
