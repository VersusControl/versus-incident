# Versus + Redis + a self-hosted SigNoz stack.
#
# HEAVY EXAMPLE — budget at least 4 GB of Docker memory. ClickHouse alone
# wants ~2 GB; see README.md ("Resource cost") before running.
#
# THE IMAGE PINS BELOW ARE OURS. SigNoz deprecated `install.sh` and its
# bundled `deploy/` Compose files at v0.130.0 — `foundryctl` is the supported
# installer now, and it GENERATES compose rather than shipping it. We pin our
# own images so this example is deterministic and needs no third-party binary
# at test time. SigNoz does not support this shape; if it breaks against a
# newer SigNoz, bump the pins here, not upstream.
services:
  # One-shot: fetch the histogramQuantile executable UDF that SigNoz's
  # ClickHouse queries call. Exits 0 and is never restarted.
  init-clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG:-25.5.6}
    container_name: versus-signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        set -e
        if [ -x /var/lib/clickhouse/user_scripts/histogramQuantile ]; then
          echo "histogramQuantile already present; skipping."
          exit 0
        fi
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        cd /tmp
        wget -O hq.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${HISTOGRAM_QUANTILE_VERSION:-v0.0.1}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xzf hq.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        chmod +x /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts

  zookeeper:
    image: signoz/zookeeper:${ZOOKEEPER_TAG:-3.7.1}
    container_name: versus-signoz-zookeeper
    user: root
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG:-25.5.6}
    container_name: versus-signoz-clickhouse
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    tty: true
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      # Stock ClickHouse config plus two drop-ins. The UDF file MUST match the
      # stock `*_function.*ml` glob, which is why it is not named the way the
      # SigNoz repo names it.
      - ./signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./signoz/clickhouse/histogram_quantile_function.xml:/etc/clickhouse-server/histogram_quantile_function.xml:ro
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: create/upgrade the SigNoz ClickHouse schema. Both SigNoz and the
  # collector are useless until this has run, so they wait on it.
  schema-migrator:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_TAG:-v0.144.5}
    container_name: versus-signoz-schema-migrator
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure

  signoz:
    image: signoz/signoz:${SIGNOZ_TAG:-v0.129.0}
    container_name: versus-signoz
    depends_on:
      schema-migrator:
        condition: service_completed_successfully
    ports:
      - "${SIGNOZ_UI_PORT:-8080}:8080"
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      # Dev-only signing secret for SigNoz's own session tokens. It is not a
      # Versus credential and never leaves this stack.
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_JWT_SECRET:-versus-signoz-dev-secret}
    volumes:
      - signoz-data:/var/lib/signoz
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  otel-collector:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_TAG:-v0.144.5}
    container_name: versus-signoz-otel-collector
    depends_on:
      schema-migrator:
        condition: service_completed_successfully
      signoz:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    # Run the pinned static config only. SigNoz's own compose also passes
    # --manager-config, which makes the collector pull config from SigNoz over
    # OpAMP and RESTART its inner service twice during the first minute —
    # dropping every OTLP connection in that window. This example's config is
    # fixed, so OpAMP buys nothing and costs a flaky first push.
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=versus-signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    # The image carries no wget/curl, so probe the health_check extension with
    # bash's /dev/tcp. Without this, `up -d` returns before the OTLP receiver
    # accepts connections and the first generator run is refused.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/13133 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot: create SigNoz's first admin account and mint the query API key
  # Versus authenticates with. SigNoz GENERATES the key value, so it cannot be
  # a compose default — the key is written to a shared volume and read by the
  # versus entrypoint below. Export SIGNOZ_API_KEY to bring your own instead.
  signoz-bootstrap:
    image: python:${PYTHON_TAG:-3.12-alpine}
    container_name: versus-signoz-bootstrap
    depends_on:
      signoz:
        condition: service_healthy
    environment:
      SIGNOZ_ADDRESS: http://signoz:8080
      SIGNOZ_ADMIN_EMAIL: ${SIGNOZ_ADMIN_EMAIL:-admin@versus.local}
      SIGNOZ_ADMIN_PASSWORD: ${SIGNOZ_ADMIN_PASSWORD:-Versus-Dev-12345}
      SIGNOZ_ORG_NAME: ${SIGNOZ_ORG_NAME:-versus-demo}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      SIGNOZ_API_KEY_FILE: /bootstrap/signoz-api-key
    command: ["python3", "/bootstrap.py"]
    volumes:
      - ./signoz/bootstrap.py:/bootstrap.py:ro
      - signoz-bootstrap:/bootstrap
    restart: on-failure

  # One-shot: generate a self-signed cert for Redis TLS into a shared volume.
  # The shared config/config.yaml connects to Redis over TLS, so every
  # docker-compose example runs Redis the same way.
  redis-tls-init:
    image: alpine:${ALPINE_TAG:-3.20}
    container_name: versus-signoz-redis-tls-init
    command:
      - sh
      - -c
      - |
        set -e
        cd /tls
        if [ -f server.crt ] && [ -f server.key ] && [ -f ca.crt ]; then
          echo "TLS material already present; skipping."
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout server.key -out server.crt \
          -subj "/CN=redis" \
          -addext "subjectAltName=DNS:redis,DNS:localhost,IP:127.0.0.1"
        cp server.crt ca.crt
        chmod 0644 server.crt server.key ca.crt
        echo "Generated self-signed cert for redis."
    volumes:
      - redis-tls:/tls

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: versus-signoz-redis
    depends_on:
      redis-tls-init:
        condition: service_completed_successfully
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-versus}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "no"
    volumes:
      - redis-data:/data
      - redis-tls:/tls:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --tls
        - --insecure
        - -a
        - ${REDIS_PASSWORD:-versus}
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

  versus:
    image: ${VERSUS_IMAGE:-ghcr.io/versuscontrol/versus-incident:latest}
    container_name: versus-signoz-app
    depends_on:
      redis:
        condition: service_healthy
      signoz:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      signoz-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${VERSUS_PORT:-3000}:3000"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-versus}
      SLACK_ENABLE: ${SLACK_ENABLE:-false}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      TELEGRAM_ENABLE: ${TELEGRAM_ENABLE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AGENT_ENABLE: ${AGENT_ENABLE:-true}
      AGENT_MODE: ${AGENT_MODE:-training}
      AGENT_AI_ENABLE: ${AGENT_AI_ENABLE:-false}
      AGENT_AI_API_KEY: ${AGENT_AI_API_KEY:-}
      AGENT_AI_MODEL: ${AGENT_AI_MODEL:-gpt-4o-mini}
      SIGNOZ_ADDRESS: ${SIGNOZ_ADDRESS:-http://signoz:8080}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      SIGNOZ_QUERY: ${SIGNOZ_QUERY:-}
    # Fall back to the bootstrapped key when the operator did not supply one.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${SIGNOZ_API_KEY}" ] && [ -f /bootstrap/signoz-api-key ]; then
          SIGNOZ_API_KEY="$$(cat /bootstrap/signoz-api-key)"
          export SIGNOZ_API_KEY
        fi
        exec /app/run
    volumes:
      - ./config:/app/config:ro
      - signoz-bootstrap:/bootstrap:ro
      - versus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  redis-tls:
  versus-data:
  clickhouse-data:
  clickhouse-user-scripts:
  zookeeper-data:
  signoz-data:
  signoz-bootstrap:
