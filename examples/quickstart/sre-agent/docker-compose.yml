# SRE agent quickstart: Versus + Redis + Loki + Grafana.
#
#   docker compose up -d                          # the stack
#   docker compose --profile fake-logs up -d      # plus a demo log stream
#   docker compose run --rm error-burst           # inject a brand-new error
#
# Every setting has a default, so no edits are needed. Ports bind to
# 127.0.0.1 only. See README.md for the walkthrough.

services:
  # One-shot: generate a self-signed cert so Versus talks to Redis over TLS.
  redis-tls-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        set -e
        cd /tls
        if [ -f server.crt ] && [ -f server.key ] && [ -f ca.crt ]; then
          echo "TLS material already present; skipping."
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout server.key -out server.crt \
          -subj "/CN=redis" \
          -addext "subjectAltName=DNS:redis,DNS:localhost,IP:127.0.0.1"
        cp server.crt ca.crt
        chmod 0644 server.crt server.key ca.crt
        echo "Generated self-signed cert for redis."
    volumes:
      - redis-tls:/tls

  redis:
    image: redis:7-alpine
    depends_on:
      redis-tls-init:
        condition: service_completed_successfully
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-versus}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "no"
    volumes:
      - redis-data:/data
      - redis-tls:/tls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--insecure", "-a", "${REDIS_PASSWORD:-versus}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:10.4.2
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  versus:
    image: ${VERSUS_IMAGE:-ghcr.io/versuscontrol/versus-incident:latest}
    depends_on:
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-versus}
      # training | shadow | detect
      AGENT_MODE: ${AGENT_MODE:-training}
      # Slack is optional: export these three to receive incidents in Slack.
      SLACK_ENABLE: ${SLACK_ENABLE:-false}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      # AI is optional: detect mode raises incidents without a key.
      AGENT_AI_ENABLE: ${AGENT_AI_ENABLE:-false}
      AGENT_AI_API_KEY: ${AGENT_AI_API_KEY:-}
      AGENT_AI_PROVIDER: ${AGENT_AI_PROVIDER:-}
      AGENT_AI_MODEL: ${AGENT_AI_MODEL:-}
    volumes:
      # Mount single files so the templates shipped in the image stay in place.
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/agent_sources.yaml:/app/config/agent_sources.yaml:ro
      - versus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional demo traffic (profile fake-logs): pushes 100 mixed application log
  # lines into Loki every 5 seconds. Runs the repo's generator inside a Python
  # image, so no Python is needed on your machine.
  log-generator:
    image: python:3.12-alpine
    profiles: ["fake-logs"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ../../../scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        echo "pushing 100 log lines to Loki every 5s"
        while true; do
          python3 /scripts/generate_noisy_logs.py --target loki \
            --loki-url http://loki:3100 --loki-app shop \
            --lines 100 --start-time now --interval-min 0 --interval-max 0.05 \
            > /dev/null || echo "push failed, retrying"
          sleep 5
        done
    restart: unless-stopped

  # One-shot (profile error-burst): pushes 60 lines of an error the demo
  # traffic never produces. Run it after switching to detect mode:
  #   docker compose run --rm error-burst
  error-burst:
    image: python:3.12-alpine
    profiles: ["error-burst"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ../../../scripts:/scripts:ro
    command:
      - python3
      - /scripts/generate_noisy_logs.py
      - --target
      - loki
      - --loki-url
      - http://loki:3100
      - --loki-app
      - shop
      - --start-time
      - now
      - --spike
      - checkout-payment-timeout
      - --spike-burst
      - "60"
      - --spike-interval-max
      - "0"

volumes:
  redis-data:
  redis-tls:
  versus-data:
  loki-data:
  grafana-data:
