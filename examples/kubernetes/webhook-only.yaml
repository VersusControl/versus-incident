# Versus Incident: one-file install of the alert router only.
# Alerts POSTed to http://versus-incident.versus:3000/api/incidents go to Slack
# and Microsoft Teams; the agent, the Kubernetes connector and on-call are off.
#
# Generated by scripts/render_kubernetes_manifest.sh from the Helm chart with
# examples/kubernetes/values-webhook-only.yaml. Do not edit by hand; edit the
# values file and regenerate.
#
# Before applying, create the namespace and the sign-in secret:
#   kubectl create namespace versus --save-config
#   kubectl -n versus create secret generic versus-incident --from-literal=gateway_secret=$(openssl rand -hex 32)
# and the channel secret, which this file does not contain:
#   kubectl -n versus create secret generic versus-incident-secrets \
#     --from-literal=slack_token=$SLACK_BOT_TOKEN \
#     --from-literal=slack_channel_id=$SLACK_CHANNEL_ID \
#     --from-literal=msteams_power_automate_url=$TEAMS_POWER_AUTOMATE_URL
---
apiVersion: v1
kind: Namespace
metadata:
  name: versus
---
# Source: versus-incident/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: versus-incident
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
---
# Source: versus-incident/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: versus-incident-config
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    name: versus-incident
    host: 0.0.0.0
    port: 3000

    # Shared secret gating /api/admin/* and /api/agent/*. Empty value
    # leaves admin routes unregistered (no silent open surface).
    gateway_secret: ${GATEWAY_SECRET}

    # Pluggable storage backend. `file` (single-node) or `postgres` (durable,
    # multi-writer). HA (ha.enabled) derives `postgres` automatically — all
    # replicas share ONE Postgres. POSTGRES_DSN is injected from a Secret.
    storage:
      type: file
      file:
        max_incidents: 1000

    kubernetes:
      evidence:
        observation_heartbeat: "5m"
        retention: "168h"
        save_chunk: 500

    alert:
      debug_body: false

      slack:
        enable: true
        token: ${SLACK_TOKEN}
        channel_id: ${SLACK_CHANNEL_ID}
        template_path: "/app/config/slack_message.tmpl"
        kubernetes_issue_template_path: ""
        message_properties:
          button_text: "Acknowledge Alert"
          button_style: "primary"

      telegram:
        enable: false

      viber:
        enable: false

      email:
        enable: false

      msteams:
        enable: true
        power_automate_url: ${MSTEAMS_POWER_AUTOMATE_URL}
        template_path: "/app/config/msteams_message.tmpl"
        kubernetes_issue_template_path: ""

      lark:
        enable: false

    queue:
      enable: false
      debug_body: false

      sns:
        enable: false
        https_endpoint_subscription_path: /sns

      sqs:
        enable: false

    # Redis Configuration Section - required for on-call functionality
    redis:
      # Configuration for external Redis
      insecure_skip_verify: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      db: 0
      connection_timeout: 30
      read_timeout: 30
      write_timeout: 30
      max_retries: 3
      min_retry_backoff: 8
      max_retry_backoff: 512
      tls: true
  connectors.yaml: |
    connectors:
      # The Kubernetes connector is off (connectors.kubernetes.enabled=false).
      aws:
        enable: false
        accounts:
          []
        tags:
          value_allowlist: ["Name","app","service","team","env"]
        budgets:
          max_requests_per_second: 2
        optional_data:
          cost_explorer: false
          security_hub: false
          config: false
          trusted_advisor: false
        health_check_interval: "5m"
        collect:
          enable: true
          intervals:
            inventory: "15m"
            health: "2m"
            changes: "5m"
          history:
            max_generations: 48
            max_age: "168h"
            change_retention: "336h"
          changes:
            lookback: "24h"
            overlap: "15m"
            page_budget: 0
            routine_events: ["ssm:UpdateInstanceInformation","ecs:SubmitTaskStateChange","ecs:SubmitContainerStateChange","logs:CreateLogStream","config:PutEvaluations"]
            burst_window: "10m"
            burst_min: 5
            failure_keep: 20
            read_cap: 20000
        applications:
          sources: ["appregistry","cloudformation","tags"]
          tag_keys: ["app","service"]
        finops:
          team_tag_key: "team"
          min_increase_usd_per_month: 100
          min_driver_usd: 50
          target_coverage: 0.8
          max_paid_requests_per_day: 20
          refresh_time: "09:00"
          cost_source_account: ""
          budgets:
            []
          account_groups:
            []
          report:
            timezone: "UTC"
            slack_summary: false
  slack_message.tmpl: |
    {{- range .alerts }}
    *{{ .status | upper }}: {{ .labels.alertname }}* ({{ or .labels.severity "none" }})
    {{ or .annotations.summary .annotations.description "No description." }}
    {{- end }}
---
# Source: versus-incident/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: versus-incident
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
---
# Source: versus-incident/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versus-incident
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versus-incident
      app.kubernetes.io/instance: versus-incident
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versus-incident
        app.kubernetes.io/instance: versus-incident
      annotations:
        checksum/config: 03c0fd7ce47f311be43087a5131a351e0f36beb050729a7e7e9209c1095b099b
        checksum/secret: ec8fcf0c4dddb86d91954f4bf31a91b032a51848a4fa1ea0a24e221c068f23b6
    spec:
      serviceAccountName: versus-incident
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versus-incident
          image: "ghcr.io/versuscontrol/versus-incident"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          env:
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: versus-incident
                  key: gateway_secret
                  optional: true
            - name: GATEWAY_SECRET_REQUIRED
              value: "true"
            - name: GATEWAY_SECRET_HINT
              value: "create it with: kubectl -n versus create secret generic versus-incident --from-literal=gateway_secret=$$(openssl rand -hex 32), then restart the pod"
            - name: STORAGE_TYPE
              value: "file"
            - name: SLACK_ENABLE
              value: "true"
            - name: SLACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: slack_token
            - name: SLACK_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: slack_channel_id
            - name: MSTEAMS_ENABLE
              value: "true"
            - name: MSTEAMS_POWER_AUTOMATE_URL
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: msteams_power_automate_url
            
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            - name: config-volume
              mountPath: /app/config/connectors.yaml
              subPath: connectors.yaml
            - name: data-volume
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: config-volume
              mountPath: /app/config/slack_message.tmpl
              subPath: slack_message.tmpl
      volumes:
        - name: config-volume
          configMap:
            name: versus-incident-config
        - name: tmp
          emptyDir: {}
        - name: data-volume
          emptyDir: {}
