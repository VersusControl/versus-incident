                  key: kubernetes_token
            - name: KUBERNETES_CA_DATA
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_ca_data
            - name: KUBERNETES_CLIENT_CERTIFICATE_DATA
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_client_certificate_data
            - name: KUBERNETES_CLIENT_KEY_DATA
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_client_key_data
            - name: KUBERNETES_AKS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_aks_client_secret
            - name: KUBERNETES_ACTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_actor_token
            - name: KUBERNETES_ACTOR_CLIENT_CERTIFICATE_DATA
              valueFrom:
                secretKeyRef:
                  name: versus-incident-secrets
                  key: kubernetes_actor_client_certificate_data
            - name: KUBERNETES_ACTOR_CLIENT_KEY_DATA
