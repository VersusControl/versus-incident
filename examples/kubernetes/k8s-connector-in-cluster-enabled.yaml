  template:
    metadata:
      labels:
        app.kubernetes.io/name: versus-incident
        app.kubernetes.io/instance: versus-incident
      annotations:
        checksum/config: 1ba5d0ce8a5a3f023cf55dfadd902626474ced680a7eb02044653e8989af5a36
        checksum/secret: 888d5137a55caef9d4c4940fe1365f9e77571c2ee215f4dcafb2c6570a67edf5
    spec:
      serviceAccountName: versus-incident
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versus-incident
          image: "ghcr.io/versuscontrol/versus-incident"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
