# Versus Incident: one-file install for an existing cluster, with
# the in-cluster Kubernetes connector enabled and its read-only reader role.
#
# Generated by scripts/render_kubernetes_manifest.sh from the Helm chart with
# connectors.kubernetes.enabled=true and otherwise default values. Do not edit
# by hand; edit the chart and regenerate.
#
# Before applying, create the namespace and the sign-in secret:
#   kubectl create namespace versus --save-config
#   kubectl -n versus create secret generic versus-incident --from-literal=gateway_secret=$(openssl rand -hex 32)
---
apiVersion: v1
kind: Namespace
metadata:
  name: versus
---
# Source: versus-incident/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: versus-incident
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
---
# Source: versus-incident/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: versus-incident-secrets
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
type: Opaque
data:
  kubernetes_actor_aks_client_secret: ""
  kubernetes_actor_client_certificate_data: ""
  kubernetes_actor_client_key_data: ""
  kubernetes_actor_token: ""
  kubernetes_aks_client_secret: ""
  kubernetes_ca_data: ""
  kubernetes_client_certificate_data: ""
  kubernetes_client_key_data: ""
  kubernetes_token: ""
---
# Source: versus-incident/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: versus-incident-config
  namespace: versus
  labels:
    helm.sh/chart: versus-incident-1.4.36
    app.kubernetes.io/name: versus-incident
    app.kubernetes.io/instance: versus-incident
    app.kubernetes.io/version: "1.4.36"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    name: versus-incident
    host: 0.0.0.0
    port: 3000

    # Shared secret gating /api/admin/* and /api/agent/*. Empty value
    # leaves admin routes unregistered (no silent open surface).
    gateway_secret: ${GATEWAY_SECRET}

    # Pluggable storage backend. `file` (single-node) or `postgres` (durable,
    # multi-writer). HA (ha.enabled) derives `postgres` automatically — all
    # replicas share ONE Postgres. POSTGRES_DSN is injected from a Secret.
    storage:
      type: file
      file:
        max_incidents: 1000

    kubernetes:
      evidence:
        observation_heartbeat: "5m"
        retention: "168h"
        save_chunk: 500

    alert:
      debug_body: false

      slack:
        enable: false
        token: ${SLACK_TOKEN}
        channel_id: ${SLACK_CHANNEL_ID}
        template_path: "/app/config/slack_message.tmpl"
        kubernetes_issue_template_path: ""
        message_properties:
          button_text: "Acknowledge Alert"
          button_style: "primary"

      telegram:
        enable: false

      viber:
        enable: false

      email:
        enable: false

      msteams:
        enable: false

      lark:
        enable: false

    queue:
      enable: false
      debug_body: false

      sns:
        enable: false
        https_endpoint_subscription_path: /sns

      sqs:
        enable: false

    # Redis Configuration Section - required for on-call functionality
    redis:
      # Configuration for external Redis
      insecure_skip_verify: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      db: 0
      connection_timeout: 30
      read_timeout: 30
      write_timeout: 30
      max_retries: 3
      min_retry_backoff: 8
      max_retry_backoff: 512
      tls: true
  connectors.yaml: |
    connectors:
      kubernetes:
        cluster_id: "default"
        credential_id: ""
        timeout: "10s"
        discovery_ttl: "5m"
        change_capture: "continuous"
        allow_private_networks: false
        endpoint_cidrs: []
        exclude_resources: ["secrets"]
        namespaces: []
        auth:
          mode: "in_cluster"
        actions:
          enable: false
          max_replicas: 20
          timeout: "15s"
          auth:
            mode: ""
      aws:
        enable: false
        accounts:
          []
        tags:
          value_allowlist: ["Name","app","service","team","env"]
        budgets:
          max_requests_per_second: 2
        optional_data:
          cost_explorer: false
          security_hub: false
          config: false
          trusted_advisor: false
        health_check_interval: "5m"
        collect:
          enable: true
          intervals:
            inventory: "15m"
            health: "2m"
            changes: "5m"
          history:
            max_generations: 48
            max_age: "168h"
            change_retention: "336h"
        applications:
          sources: ["appregistry","cloudformation","tags"]
          tag_keys: ["app","service"]
        finops:
          team_tag_key: "team"
          min_increase_usd_per_month: 100
          min_driver_usd: 50
          target_coverage: 0.8
          max_paid_requests_per_day: 20
          refresh_time: "09:00"
          cost_source_account: ""
          budgets:
            []
          account_groups:
            []
          report:
            timezone: "UTC"
            slack_summary: false
---
