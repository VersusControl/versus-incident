                  key: kubernetes_actor_aks_client_secret
            
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            - name: config-volume
              mountPath: /app/config/connectors.yaml
              subPath: connectors.yaml
            - name: data-volume
